[package]
name = "mandart-engine-rust"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "mandart-core",
    "mandart-cli",
    "mandart-wasm"
]

resolver = "2"  # Ensure all dependencies are unified

[dependencies]
mandart-core = { path = "mandart-core" }  # ✅ Add this so tests can access `core`

base64 = "0.22.1"
console_error_panic_hook = { version = "0.1.7", optional = true }
console_log = { version = "1.0.0", optional = true }
csv = "1.3.1"
env_logger = "0.11.6"
image = "0.25.5"
log = "0.4.26"
serde = { version = "1.0.218", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
serde_json = "1.0.139"
tempfile = "3.17.1"
toml = "0.8.20"
wasm-bindgen = { version = "0.2.100", features = ["serde-serialize"], optional = true }
web-sys = { version = "0.3.77", features = ["console"] }

[features]
wasm-bindgen = ["dep:wasm-bindgen"]
serde-wasm-bindgen = ["dep:serde-wasm-bindgen"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
console_log = ["dep:console_log"]
