[package]
name = "mandart-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
toml = "0.8.20"
log = "0.4.26"
csv = "1.3"  # ✅ Core handles CSV since both CLI and WASM need it.
image = "0.25.5"

[lib]
crate-type = ["rlib"]  # Pure Rust library
